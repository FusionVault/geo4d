# CI for geo4d. Depends only on geo3d: fmt, build (default + all features), clippy, test, the
# example, docs, a publish dry-run — and a check that the declared rust-version really builds it.
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust · fmt · clippy · test · doc · publish --dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --check
      - name: build
        run: cargo build && cargo build --all-features
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test && cargo test --all-features
      - name: example
        run: cargo run --example tracking
      - name: doc
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - name: publish dry-run
        run: cargo publish --dry-run

  msrv:
    name: msrv · the declared rust-version builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: read rust-version
        id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      # The core (+ serde) must build on the declared MSRV. The forwarded interop bridges
      # (mint/glam/nalgebra/geo-types) track their own, newer, upstream MSRVs, so they are not part
      # of this check; the stable `rust` job builds them with `--all-features`.
      - run: cargo check --all-targets --features serde
